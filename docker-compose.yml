# For more information: https://laravel.com/docs/sail
services:
  laravel:
    # One Dockerfile for every PHP version, like membership-deployment's images.
    # Set SAIL_PHP_VERSION in .env and run `docker compose up -d` to switch;
    # each version builds to its own image tag, so switching back needs no rebuild.
    build:
      context: .docker/sail
      dockerfile: Dockerfile
      args:
        WWWGROUP: "${WWWGROUP}"
        PHP_VERSION: "${SAIL_PHP_VERSION:-8.4}"
        INSTALL_XDEBUG: "${SAIL_INSTALL_XDEBUG:-false}"
    image: sail-${SAIL_PHP_VERSION:-8.4}/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${APP_PORT:-80}:80"
      - "127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    environment:
      WWWUSER: "${WWWUSER}"
      LARAVEL_SAIL: 1
      XDEBUG_MODE: "${SAIL_XDEBUG_MODE:-off}"
      XDEBUG_CONFIG: "${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}"
    volumes:
      - ".:/var/www/html"
    networks:
      - sail
    depends_on:
      - mysql
  mysql:
    image: "mysql/mysql-server:8.0"
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - "sail-mysql:/var/lib/mysql"
      - ".docker/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh"
    networks:
      - sail
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      retries: 3
      timeout: 5s
  mailhog:
      image: 'mailhog/mailhog:latest'
      ports:
          - '127.0.0.1:${FORWARD_MAILHOG_PORT:-1025}:1025'
          - '127.0.0.1:${FORWARD_MAILHOG_DASHBOARD_PORT:-8025}:8025'
      networks:
          - sail
networks:
  sail:
    driver: bridge
volumes:
  sail-mysql:
    driver: local
