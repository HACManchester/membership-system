name: CI

on:
  push:
    branches: ["master"]
  pull_request:

# Jobs only read the repository. Anything needing more asks for it per job.
permissions:
  contents: read

# A new push to a PR supersedes its running build. Builds on master always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lints and builds the frontend once, rather than in every PHP leg. The PHP
  # legs render Blade views, whose mix() calls need the built manifest, so the
  # build output is handed to them as an artifact.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Yarn (Berry, pinned by package.json's packageManager) comes from Corepack,
      # which must be enabled after setup-node so it belongs to Node 24
      - name: Enable Corepack
        run: corepack enable

      - name: Get Yarn Cache Directory
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Yarn install
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test --ci

      - name: Build
        run: yarn run production

      # The paths share public/ as their root, so the artifact holds them
      # relative to it
      - name: Upload the built assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-assets
          path: |
            public/mix-manifest.json
            public/js/
            public/css/application.css
            public/fonts/
          if-no-files-found: error
          retention-days: 1

  build:
    name: PHP ${{ matrix.php }}${{ matrix.experimental && ' (next, non-blocking)' || '' }}
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The "next" PHP runs ahead of the upgrade so each engine bump promotes a
    # version that's already green rather than discovering problems on the day.
    # It reports but doesn't block until it passes; then drop `experimental`
    # from it and add the following version as the new experimental entry.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Production's engine, and composer.json's config.platform.php.
          - php: "8.4"
            experimental: false
          # Production's next engine, which Laravel 13 supports. Green, so it blocks.
          - php: "8.5"
            experimental: false

    steps:
      # Actions are pinned to commit SHAs (version in the comment); Dependabot updates both
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CI never pushes, so the job token needn't be left in the checkout
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo
          coverage: xdebug

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Set up dependency caching for faster installs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Composer install
        run: composer install --prefer-dist

      # setup-php disables Composer's own audit on install (COMPOSER_NO_AUDIT)
      - name: Composer audit
        run: composer audit --locked

      - name: Download the built assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-assets
          path: public

      - name: Prepare the application
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate

      - name: Clear Config
        run: php artisan config:clear

      # Some deprecations (e.g. ${var} interpolation) are raised when a file is
      # compiled, which can happen during app bootstrap before the test suite's
      # deprecation guard is installed. php -l reports them reliably.
      - name: Lint for compile-time deprecations
        run: |
          out=$(find app config database routes tests bootstrap resources/lang -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -d error_reporting=E_ALL -d display_errors=1 -l 2>&1 \
            | grep -v '^No syntax errors detected' || true)
          if [ -n "$out" ]; then echo "$out"; exit 1; fi

      - name: phpstan
        run: vendor/bin/phpstan analyse

      - name: phpunit
        run: vendor/bin/phpunit --coverage-text

  # Fails a PR that adds a dependency with a known high-severity vulnerability
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # The one check branch protection requires. Matrix legs can be renamed, added or
  # removed without touching the repository settings.
  ci-result:
    name: All checks passed
    if: always()
    needs: [frontend, build, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job passed
        env:
          FRONTEND: ${{ needs.frontend.result }}
          BUILD: ${{ needs.build.result }}
          REVIEW: ${{ needs.dependency-review.result }}
        run: |
          echo "frontend: $FRONTEND, build: $BUILD, dependency review: $REVIEW"
          [ "$FRONTEND" = "success" ] || exit 1
          [ "$BUILD" = "success" ] || exit 1
          # Dependency review only runs on pull requests
          [ "$REVIEW" = "success" ] || [ "$REVIEW" = "skipped" ] || exit 1
